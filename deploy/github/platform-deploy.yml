# → Add to the Platform repo as .github/workflows/deploy.yml
# (usamarasheed26/Platform). Requires the reusable workflow repo
# usamarasheed26/stratagem-deploy and the org/repo secrets
# DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY.

name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    uses: usamarasheed26/stratagem-deploy/.github/workflows/deploy-reusable.yml@main
    with:
      app: platform
    secrets: inherit
