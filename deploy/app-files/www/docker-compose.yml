# Canonical compose for the marketing site (apex + www) + contact API.
# This file is the reference copy matching /opt/apps/www/docker-compose.yml.
services:
  www:
    image: nginx:alpine
    container_name: app_www
    restart: always
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./deploy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.www-http.rule=Host(`stratagemengine.com`) || Host(`www.stratagemengine.com`)"
      - "traefik.http.routers.www-http.entrypoints=http"
      - "traefik.http.routers.www-http.middlewares=www-redirect"
      - "traefik.http.middlewares.www-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.www-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.www.rule=Host(`stratagemengine.com`) || Host(`www.stratagemengine.com`)"
      - "traefik.http.routers.www.entrypoints=https"
      - "traefik.http.routers.www.priority=10"
      - "traefik.http.routers.www.tls=true"
      - "traefik.http.routers.www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.www.tls.domains[0].main=stratagemengine.com"
      - "traefik.http.routers.www.tls.domains[0].sans=www.stratagemengine.com"
      - "traefik.http.services.www.loadbalancer.server.port=80"

  api:
    build: ./api
    container_name: app_api
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set (Coolify env var, or .env alongside this file)}
      PORT: "3000"
    networks:
      - coolify
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=(Host(`stratagemengine.com`) || Host(`www.stratagemengine.com`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=https"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

networks:
  coolify:
    external: true
