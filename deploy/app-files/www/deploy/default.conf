# Replaces the stock nginx:alpine default.conf.
# Serves the static site and refuses to hand out repo internals
# (.git/, .env, .gitignore, docker-compose.yml, the api/ source, ...).
# /api/* never reaches nginx in production — Traefik routes it to the api
# service first — but the block below is a safety net.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /docker-compose.yml { deny all; access_log off; }
    location ^~ /deploy/           { deny all; access_log off; }
    location ^~ /api/              { return 404; }
}
