# Canonical Docker Compose for SmartAgentX.ai on coolify-server.
# Deployed at /opt/apps/smartagentx/docker-compose.yml
services:
  web:
    image: nginx:1.27-alpine
    container_name: app_smartagentx_web
    restart: always
    volumes:
      - ./Public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - coolify
    environment:
      - TZ=UTC
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      # --- HTTP: redirect to HTTPS ---
      - "traefik.http.routers.smartagentx-http.rule=Host(`smartagentx.ai`) || Host(`www.smartagentx.ai`)"
      - "traefik.http.routers.smartagentx-http.entrypoints=http"
      - "traefik.http.routers.smartagentx-http.middlewares=smartagentx-redirect"
      - "traefik.http.middlewares.smartagentx-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.smartagentx-redirect.redirectscheme.permanent=true"
      # --- HTTPS ---
      - "traefik.http.routers.smartagentx.rule=Host(`smartagentx.ai`) || Host(`www.smartagentx.ai`)"
      - "traefik.http.routers.smartagentx.entrypoints=https"
      - "traefik.http.routers.smartagentx.tls=true"
      - "traefik.http.routers.smartagentx.tls.certresolver=letsencrypt"
      - "traefik.http.routers.smartagentx.tls.domains[0].main=smartagentx.ai"
      - "traefik.http.routers.smartagentx.tls.domains[0].sans=www.smartagentx.ai"
      - "traefik.http.services.smartagentx.loadbalancer.server.port=80"

networks:
  coolify:
    external: true
