# Nginx configuration for SmartAgentX.ai container behind Traefik reverse proxy
# Traefik terminates TLS and handles HTTP->HTTPS redirect.
# This server listens on port 80 inside the container for requests forwarded by Traefik.

server {
    listen 80;
    listen [::]:80;
    server_name smartagentx.ai www.smartagentx.ai localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Performance & Compression
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers (Supplements Traefik)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Clean URLs Routing
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # Cache Policy for Static Assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache Policy for HTML & Manifests
    location ~* \.(?:html|xml|json|txt)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Health Check Endpoint (for Docker & Traefik)
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Custom Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
